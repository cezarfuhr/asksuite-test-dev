services:
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: orchestrator
    ports:
      - "8081:8080"
    environment:
      - ORCHESTRATOR_PORT=8080
      - PUPPETEER_SERVICE_URL=http://scraper-puppeteer:3001
      - PLAYWRIGHT_SERVICE_URL=http://scraper-playwright:3002
      - PLAYWRIGHT_TRAFFIC_PERCENTAGE=20
      - CIRCUIT_BREAKER_ENABLED=true
      - CIRCUIT_BREAKER_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=30000
    depends_on:
      - scraper-puppeteer
      - scraper-playwright
    networks:
      - scraper-network
    restart: unless-stopped

  scraper-puppeteer:
    build:
      context: .
      dockerfile: services/scraper-puppeteer/Dockerfile
    container_name: scraper-puppeteer
    environment:
      - SCRAPER_PORT=3001
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - SCRAPER_TIMEOUT=60000
      - MAX_CONCURRENT_SCRAPES=5
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  scraper-playwright:
    build:
      context: .
      dockerfile: services/scraper-playwright/Dockerfile
    container_name: scraper-playwright
    environment:
      - SCRAPER_PORT=3002
      - SCRAPER_TIMEOUT=60000
      - MAX_CONCURRENT_SCRAPES=5
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6390:6379"
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=asksuite
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5444:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

networks:
  scraper-network:
    driver: bridge

volumes:
  postgres-data:
